[package]
name = "price_service"
version = "0.1.0"
edition = "2024"

# Token prices for OpenChat, from one long-running container that keeps them cached in memory. For
# now it's ChartBot, which replies to /chart with a price chart. Next, it'll serve the prices that
# OpenChat's cashtags show.

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
dejavu = "2.37"
futures = "0.3"
ic-agent = "0.39"
image = { version = "0.25", default-features = false, features = ["png"] }
# open-chat-labs/open-chat-bots#243, for the SDK's upload_image, until it's merged
oc_bots_sdk = { git = "https://github.com/open-chat-labs/open-chat-bots", rev = "7bc9ac0d597ffccbcfade9e13be42bff91882901" }
oc_bots_sdk_offchain = { git = "https://github.com/open-chat-labs/open-chat-bots", rev = "7bc9ac0d597ffccbcfade9e13be42bff91882901", features = ["tower"] }
plotters = { version = "0.3", default-features = false, features = ["ab_glyph", "datetime", "line_series", "svg_backend"] }
resvg = { version = "0.49", default-features = false, features = ["text"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"

# OpenChat's msgpack, which the SDK speaks, needs this fork, as open-chat-bots does
[patch.crates-io]
rmp-serde = { git = "https://github.com/hpeebles/msgpack-rust", rev = "ce6041181a85f926edf87b8c037b7b1295d024dd" }
